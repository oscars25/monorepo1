server {
    listen 80;
    server_name _;

    location /api/ {
        # URL de tu backend en Render
        proxy_pass https://monorepo1-caqf.onrender.com/api/;

        proxy_http_version 1.1;

        # Host correcto para el upstream
        proxy_set_header Host monorepo1-caqf.onrender.com;

        # MUY IMPORTANTE: permitir SNI al upstream
        proxy_ssl_server_name on;

        # Cabeceras estándar
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # (Opcional) los de websockets realmente no los necesitas aquí
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";

        # CORS (si quieres mantenerlos en Nginx)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
    }

    # Servir Angular
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}